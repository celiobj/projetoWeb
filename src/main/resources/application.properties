# =======================================================
# Spring Boot Application Configuration
# =======================================================
spring.application.name=ControleFacilWeb

# =======================================================
# Server Configuration
# =======================================================
server.port=8080
server.servlet.context-path=/

# =======================================================
# Database Configuration
# =======================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/bragasi
spring.datasource.username=postgres
spring.datasource.password=slipclown
spring.datasource.driver-class-name=org.postgresql.Driver

# =======================================================
# JPA Configuration
# =======================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =======================================================
# Thymeleaf Configuration
# =======================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# =======================================================
# Application Info
# =======================================================
app.name=ControleFácil Web
app.description=Sistema de Gestão de Produtos
app.version=1.0.0

# =======================================================
# Login
# =======================================================
app.login.usuario=admin
app.login.senha=admin

# =======================================================
# JWT Configuration
# =======================================================
# IMPORTANTE: troque esta chave antes de ir para produção (mínimo 32 caracteres)
app.jwt.secret=ControleFacilWebSecretKey2024MudeMeEmProducao!!
app.jwt.expiration=86400000

# =======================================================
# CORS — origem permitida para o front Angular
# =======================================================
app.cors.allowed-origin=http://localhost:4200

# =======================================================
# Swagger / OpenAPI
# =======================================================
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
# Exibe apenas os endpoints /api/**
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
