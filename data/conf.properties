# =======================================================
# Configurações de conexão - AccessDatabase
# =======================================================

# Caminho para o arquivo .accdb, relativo ao diretório de execução da aplicação
# Coloque o arquivo na pasta data/ na raiz do projeto
db.path=data/BRAGASI/Bragasi_000.accdb

# Cliente ativo (usado por conectar() sem parâmetro quando db.path não está definido)
# Define qual arquivo .accdb será aberto em C:/Sistemas/BD/Bragasi/<cliente>.accdb
cliente=ultraBarber

# Modo de conexão ativo (sobrescrito em Login.conexao via código se necessário)
# 1 = Access local  |  2 = PostgreSQL local  |  3 = PostgreSQL remoto
conexao=1

# -------------------------------------------------------
# PostgreSQL local (modo 2)
# -------------------------------------------------------
pg.local.host=localhost
pg.local.port=5432
pg.local.database=ultrabarber
pg.local.user=postgres
pg.local.password=

# -------------------------------------------------------
# PostgreSQL remoto (modo 3)
# -------------------------------------------------------
pg.remoto.host=postgresql.uhserver.com
pg.remoto.port=5432
pg.remoto.database=ultrabarber
pg.remoto.user=
pg.remoto.password=
